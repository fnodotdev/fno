# Capability tier: does the reader of skills/speculate/SKILL.md name the
# command it teaches in its current spelling? The fno-agents -> fno-agent
# rename moved every command the skill names; graded on the new spelling.
id: capability-speculate-command-spelling
tier: regression
prompt: |
  Read skills/speculate/SKILL.md. Write the command that cleans up a speculation worktree to
  command-answer.md at the repo root, on one line, exactly as the skill
  spells it. Do not change any other file.
grade:
  - kind: file-exists
    path: command-answer.md
  - kind: exit
    command: "grep -qF 'fno agent workspace worktree cleanup' command-answer.md && ! grep -qF 'fno agents workspace' command-answer.md"
timeout_minutes: 10
tags: [capability, speculate]
