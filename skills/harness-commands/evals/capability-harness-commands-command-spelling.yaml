# Capability tier: does the reader of skills/harness-commands/SKILL.md name the
# command it teaches in its current spelling? The fno-agents -> fno-agent
# rename moved every command the skill names; graded on the new spelling.
id: capability-harness-commands-command-spelling
tier: regression
prompt: |
  Read skills/harness-commands/SKILL.md. Write the command that types a raw slash command into another session to
  command-answer.md at the repo root, on one line, exactly as the skill
  spells it. Do not change any other file.
grade:
  - kind: file-exists
    path: command-answer.md
  - kind: exit
    command: "grep -qF 'fno agent mail send' command-answer.md && ! grep -qF 'fno agents mail' command-answer.md"
timeout_minutes: 10
tags: [capability, harness-commands]
