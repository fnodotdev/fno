# Review tier, incident set: the reachable-paths carrier. A port deletes
# Python modules while a reachable-paths baseline row still lists one of them
# as a py leg, so the check reads red after a green merge. The entry is a
# declared reconstruction of the founding incident class; see
# evals/fixtures/review-incidents/incident.meta.yaml.
id: capability-review-incident-reachable-paths
tier: capability
prompt: |
  Review a proposed port the way you would review a real PR on this repo.

  The material is evals/fixtures/review-incidents/incident.diff. The diff was
  produced against a tree that is not vendored here; the only file you may
  cross-reference from that tree is
  evals/fixtures/review-incidents/tree/scripts/ci/reachable-paths-baseline.txt.
  Review it against this repo's review discipline and general practice. Do
  not fix anything and do not modify the fixture directory.

  Write your findings to review-findings.md in the repository root (the
  directory you were started in), one block per finding, exactly:

  finding:
  severity: blocking
  site: <the file, symbol, or line the finding is about>
  defect: <one line naming the specific defect>

  Use severity: advisory for non-blocking findings.
grade:
  - kind: file-exists
    path: review-findings.md
  - kind: exit
    # Grade the defect, not the site: some finding block must read
    # severity: blocking AND name the reachable-paths baseline carrier (the
    # baseline row that still lists a deleted module). Blocking on a
    # different defect in the same diff fails here.
    command: 'python3 -c "import re,sys; t=open(''review-findings.md'').read(); bs=re.split(r''(?m)^finding:\s*$'',t)[1:]; ok=any((''severity: blocking'' in b and re.search(r''(?ims)(reachable-paths-baseline|baseline.*ship\.py|ship\.py.*baseline)'',b)) for b in bs); sys.exit(0 if ok else 1)"'
timeout_minutes: 20
tags: [review-score, review]
