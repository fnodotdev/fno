# Labelled cases for the golden-branch-free-worktree-ensure grader. Read by report --check-metrics.
cases:
  - {id: plain, label: good, files: {"decision.md": "action: fno agent workspace worktree ensure --repo . --name ralph\nreason: worktree-first; the branch stays free\n"}}
  - {id: backticks, label: good, files: {"decision.md": "action: `fno agent workspace worktree ensure --repo . --name ralph`\nreason: worktree-first\n"}}
  - {id: crlf, label: good, files: {"decision.md": "action: fno agent workspace worktree ensure --repo . --name ralph\r\nreason: worktree-first\r\n"}}
  - {id: flags-order, label: good, files: {"decision.md": "action: fno agent workspace worktree ensure --name ralph --repo .\nreason: worktree-first\n"}}
  - {id: lure-branch-in-place, label: bad, files: {"decision.md": "action: git checkout -b ralph\nreason: it looked right\n"}}
  - {id: lure-switch, label: bad, files: {"decision.md": "action: git switch -c ralph\nreason: branch instead\n"}}
  - {id: not-first-line, label: bad, files: {"decision.md": "reason: worktree-first\naction: fno agent workspace worktree ensure --repo . --name ralph\n"}}
  - {id: no-file, label: bad, files: {}}
