  - {id: lure-default-tdd, label: bad, files: {"decision.md": "executor: tdd\nsource: skills/execute/references/executor-resolution.md\n"}}
  - {id: subagent-name, label: bad, files: {"decision.md": "executor: frontend-executor\nsource: skills/execute/references/executor-resolution.md\n"}}
  - {id: wrong-source, label: bad, files: {"decision.md": "executor: impeccable\nsource: docs/api-reference.md\n"}}
  - {id: swapped-lines, label: bad, files: {"decision.md": "source: skills/execute/references/executor-resolution.md\nexecutor: impeccable\n"}}
