name: release-app

# Build and publish the macOS desktop app (`fno-app`). The app versions on its
# own line (crates/fno-app/Cargo.toml), decoupled from fno: pushing a
# `fno-app-v<version>` tag builds that version and publishes it as a GitHub
# release; a manual dispatch is an inspection build that publishes nothing.
# The tarball holds `fno-app.app`, a universal binary (arm64 + x86_64):
# Developer ID signed when the two certificate secrets are set, and also
# notarized and stapled when the three App Store Connect secrets are set too
# (docs/install.md). Ad hoc signed otherwise.

on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  push:
    tags:
      - "fno-app-v*"

permissions:
  contents: read

jobs:
  build:
    name: app macos-universal
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      # Two release builds, then one universal binary. The lipo output lands
      # on the plain-target path the assemble step reads, so the bundle,
      # sign, notarize and package steps stay arch-blind.
      - name: Build fno-app (arm64 and x86_64)
        run: |
          cargo build --release --manifest-path crates/fno-app/Cargo.toml --bin fno-app --target aarch64-apple-darwin
          cargo build --release --manifest-path crates/fno-app/Cargo.toml --bin fno-app --target x86_64-apple-darwin
          lipo -create \
            crates/fno-app/target/aarch64-apple-darwin/release/fno-app \
            crates/fno-app/target/x86_64-apple-darwin/release/fno-app \
            -output crates/fno-app/target/release/fno-app

      - name: Assemble fno-app.app
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/fno-app/Cargo.toml | head -1)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "fno-app-v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match crates/fno-app/Cargo.toml version ${version}"
            exit 1
          fi
          git fetch --depth=1 origin "${{ github.sha }}"
          for f in scripts/release/build-app-bundle.sh crates/fno-app/macos/Info.plist.in tests/test_build_app_bundle.sh; do
            mkdir -p "$(dirname "$f")"
            git show "${{ github.sha }}:$f" > "$f"
          done
          bash tests/test_build_app_bundle.sh
          bash scripts/release/build-app-bundle.sh crates/fno-app/target/release/fno-app "$version" "$PWD"

      - name: Check macOS signing secrets
        id: signing
        # Secrets are unreadable in `if:`, so they pass through env. A fork or
        # a caller without `secrets: inherit` holds none; the build then ships
        # an ad hoc signed bundle and says so in one line.
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          sign=false
          notarize=false
          if [ -n "$CERT_P12" ] && [ -n "$CERT_PASSWORD" ]; then
            sign=true
            if [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ]; then
              notarize=true
            else
              echo "::notice::macOS notarization skipped: the App Store Connect secrets are not set (see docs/install.md); shipping a Developer ID signed, un-notarized fno-app.app."
            fi
          else
            echo "::notice::macOS signing skipped: the Developer ID certificate secrets are not set (see docs/install.md); shipping an ad hoc signed fno-app.app."
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"

      - name: Sign fno-app.app
        if: steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.sha }}"
          git show "${{ github.sha }}:scripts/release/macos-sign.sh" > "$RUNNER_TEMP/macos-sign.sh"
          sign="bash $RUNNER_TEMP/macos-sign.sh"
          $sign sign fno-app.app
          if [ "${{ steps.signing.outputs.notarize }}" = "true" ]; then
            $sign notarize fno-app.app
            $sign staple fno-app.app
            spctl -a -t exec -vv fno-app.app
          fi
          $sign cleanup

      - name: Ad hoc sign
        if: steps.signing.outputs.sign != 'true'
        run: codesign --force --deep -s - fno-app.app

      - name: Package tarball
        run: tar -czf fno-app-macos.tar.gz fno-app.app

      - name: Smoke (the bundle verifies, the binary is universal, and it names itself)
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf fno-app-macos.tar.gz -C "$RUNNER_TEMP"
          codesign --verify --deep --strict "$RUNNER_TEMP/fno-app.app"
          archs="$(lipo -archs "$RUNNER_TEMP/fno-app.app/Contents/MacOS/fno-app")"
          echo "$archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::universal binary missing a slice: $archs"; exit 1 ;; esac
          out="$("$RUNNER_TEMP/fno-app.app/Contents/MacOS/fno-app" --version)"
          echo "$out"
          case "$out" in fno-app*) ;; *) echo "::error::--version did not start with fno-app"; exit 1 ;; esac
          # The runner is arm64, so --version above runs the arm64 slice. This
          # probe forces the Intel slice (Rosetta), so a build that links for
          # x86_64 but fails at startup cannot ship.
          out86="$(arch -x86_64 "$RUNNER_TEMP/fno-app.app/Contents/MacOS/fno-app" --version)"
          echo "$out86"
          case "$out86" in fno-app*) ;; *) echo "::error::x86_64 slice did not run: $out86"; exit 1 ;; esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-macos-universal
          path: fno-app-macos.tar.gz

  publish:
    name: publish the app release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-macos-universal
          path: dist

      - name: Create the GitHub release
        run: |
          set -euo pipefail
          (cd dist && sha256sum fno-app-macos.tar.gz > fno-app-macos.tar.gz.sha256)
          # The app reads this body from the release feed and shows it once
          # after an update, so it comes from the changelog section.
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --latest=false \
            --title "fno-app ${GITHUB_REF_NAME#fno-app-v}" \
            --notes "$(bash scripts/release/app-release-notes.sh "${GITHUB_REF_NAME#fno-app-v}")" \
            dist/fno-app-macos.tar.gz dist/fno-app-macos.tar.gz.sha256
