name: release-app

# Build the macOS desktop app (`fno-app`) into one tarball. Build-only: this
# workflow publishes nothing. It runs on manual dispatch (an inspection
# build) or as a reusable workflow called from release.yml, which owns every
# publish leg behind the `release` environment approval. The tarball holds
# `fno-app.app`: Developer ID signed, notarized and stapled when the five
# signing secrets are set (docs/install.md), ad hoc signed otherwise.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version to stamp (PEP 440); empty builds the checked-out source version"
        type: string
        default: ""
      ref:
        description: "Commit to build; empty builds the caller's ref"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: app macos-arm64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No `ref:` argument: the pin step below applies inputs.ref through
        # plain git, as release-binaries.yml does.
        with:
          fetch-depth: 0

      - name: Pin build ref
        if: inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$REF"
          git checkout --detach FETCH_HEAD

      - name: Stamp release version
        if: inputs.version != ''
        # Workspace-only stamp, never committed. The script comes from THIS
        # workflow's commit, as in release-binaries.yml.
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.sha }}"
          git show "${{ github.sha }}:scripts/release/sync-version.sh" > scripts/release/sync-version.sh
          bash scripts/release/sync-version.sh "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build fno-app
        run: cargo build --release --manifest-path crates/fno-app/Cargo.toml --bin fno-app

      - name: Assemble fno-app.app
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' crates/fno/Cargo.toml | head -1)}"
          git fetch --depth=1 origin "${{ github.sha }}"
          for f in scripts/release/build-app-bundle.sh crates/fno-app/macos/Info.plist.in; do
            mkdir -p "$(dirname "$f")"
            git show "${{ github.sha }}:$f" > "$f"
          done
          bash scripts/release/build-app-bundle.sh crates/fno-app/target/release/fno-app "$version" "$PWD"

      - name: Check macOS signing secrets
        id: signing
        # Secrets are unreadable in `if:`, so they pass through env. A fork or
        # a caller without `secrets: inherit` holds none; the build then ships
        # an ad hoc signed bundle and says so in one line.
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -n "$CERT_P12" ] && [ -n "$CERT_PASSWORD" ] \
            && [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing and notarization skipped: Developer ID secrets are not set (see docs/install.md); shipping an ad hoc signed fno-app.app."
          fi

      - name: Sign, notarize and staple fno-app.app
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.sha }}"
          git show "${{ github.sha }}:scripts/release/macos-sign.sh" > "$RUNNER_TEMP/macos-sign.sh"
          sign="bash $RUNNER_TEMP/macos-sign.sh"
          $sign sign fno-app.app
          $sign notarize fno-app.app
          $sign staple fno-app.app
          $sign cleanup
          spctl -a -t exec -vv fno-app.app

      - name: Ad hoc sign
        if: steps.signing.outputs.ready != 'true'
        run: codesign --force --deep -s - fno-app.app

      - name: Package tarball
        run: tar -czf fno-app-macos-arm64.tar.gz fno-app.app

      - name: Smoke (the bundle verifies and the binary names itself)
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf fno-app-macos-arm64.tar.gz -C "$RUNNER_TEMP"
          codesign --verify --deep --strict "$RUNNER_TEMP/fno-app.app"
          out="$("$RUNNER_TEMP/fno-app.app/Contents/MacOS/fno-app" --version)"
          echo "$out"
          case "$out" in fno-app*) ;; *) echo "::error::--version did not start with fno-app"; exit 1 ;; esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-macos-arm64
          path: fno-app-macos-arm64.tar.gz
