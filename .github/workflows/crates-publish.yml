name: crates-publish

# Validate that `fno-agents`, `fno` and `fno-mail` still PACKAGE: on PRs
# touching either crate it runs `cargo publish --dry-run` only (no upload).
# Publishing lives in release.yml's `publish` job, behind the `release`
# environment approval - crates.io uploads are permanent (a version cannot be
# re-uploaded), so the one click is the only path.

# Cancel a PR's superseded dry-run on re-push (Actions minute conservation).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - crates/fno-agents/**
      - crates/fno/**
      - crates/fno-mail/**
      - .github/workflows/crates-publish.yml

permissions:
  contents: read

jobs:
  dry-run:
    name: cargo publish --dry-run (${{ matrix.crate }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # crate = the crates.io name; dir = the crate directory.
        include:
          - crate: fno-mail
            dir: crates/fno-mail
          - crate: fno-agents
            dir: crates/fno-agents
          - crate: fno
            dir: crates/fno
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Dry-run package + verify
        # Explicit --manifest-path (never a cwd/glob resolution) so the stale
        # untracked pre-rename crate dir can never be packaged by mistake (AC5-FR).
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ matrix.crate }}" != "fno-mail" ]; then
            # fno-mail versions on its own. A version not on crates.io yet
            # resolves through the tree, as release publishes it first. A
            # version already there is what release will skip, so the dry
            # run verifies against the registry copy: a fno-mail change
            # merged without a version bump fails here, not at release.
            mail="$(perl -ne 'if(/^version = "(.*)"/){print $1; exit}' crates/fno-mail/Cargo.toml)"
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/fno-mail/${mail}")"
            if [ "$code" != "200" ]; then
              extra=(--config 'patch.crates-io.fno-mail.path="crates/fno-mail"')
            fi
          fi
          cargo publish --dry-run --manifest-path "${{ matrix.dir }}/Cargo.toml" "${extra[@]}"
