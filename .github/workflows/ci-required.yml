name: ci-required

# One aggregate check over the whole PR head. It goes green only when every
# other workflow's latest run at the head, and every check inside it, finished
# without a failure or a timeout (scripts/ci/ci-required.sh). Superseded
# cancels do not count; a cancelled latest run waits for its rerun. A PR
# carrying the `pr-hold` label (a live pr-hold decision, posted at record
# time by pr_admission::after_record) fails this check, so D3383's ruleset
# requirement gates every merge endpoint on the hold. Marking this one context
# required on main makes `gh pr merge --auto` wait for all of CI, not only for
# the one context the ruleset names today.

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-required-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  ci-required:
    runs-on: ubuntu-latest
    # Covers the slowest PR workflow plus queue time.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/ci-required.sh
            scripts/tests/ci-required-selftest.sh
          sparse-checkout-cone-mode: false
      - name: classify selftest
        run: bash scripts/tests/ci-required-selftest.sh
      - name: wait for every run at the head
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/ci-required.sh "${{ github.repository }}" "${{ github.event.pull_request.head.sha }}" "${{ github.run_id }}" "${{ github.event.pull_request.number }}"
