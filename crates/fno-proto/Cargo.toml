[package]
name = "fno-proto"
# Versions on its own API, apart from the fno product number. A release
# publishes it only when this version is not on crates.io yet; fno takes it
# by caret range. Raise it in the PR that raises PROTO_VERSION: the bump guard
# (scripts/ci/check-proto-version-bump.sh) refuses a wire bump without it.
version = "0.2.5"
edition = "2021"
rust-version = "1.92"
description = "The fno mux wire contract: client and server messages, frame and layout types, framing, and a published JSON Schema."
license = "Apache-2.0"
repository = "https://github.com/fnodotdev/fno"
homepage = "https://github.com/fnodotdev/fno"
documentation = "https://docs.rs/fno-proto"
readme = "README.md"
publish = true
include = ["src/**", "examples/**", "schema/**", "SPEC.md", "Cargo.toml", "README.md", "LICENSE*"]

# A library only. The socket lifecycle (where the socket lives, bind-or-probe)
# stays in fno: it reads fno's own config and state layout.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The async read/write pair (`read_msg`, `write_msg`). Off by default so a
# plain client links serde and serde_json only.
tokio = { version = "1", default-features = false, features = ["io-util"], optional = true }
# Derives the published JSON Schema. Used by the gen-schema example only.
schemars = { version = "1", optional = true }
# The text fold the mux and the agent screen seam share (`vt_text`). Same
# exact pin as fno and fno-agent; the rio-vt pin step in rust-ci holds all
# three equal.
rio-vt = { version = "=0.5.29", default-features = false, optional = true }
# Derives the TypeScript bindings the gen-ts example publishes. Used by the
# gen-ts example only. serde-json-impl maps serde_json::Value fields to `any`.
ts-rs = { version = "12.0.1", optional = true, features = ["serde-json-impl"] }
# The feed module's date reads (the search grammar's date keys, the table's
# time column). Behind the `feed` feature so the desktop app never links it.
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "clock"], optional = true }
# The grammar names the nearest key on an unknown-key error.
strsim = { version = "0.11", optional = true }

[features]
default = []
async = ["dep:tokio"]
schema = ["dep:schemars"]
vt = ["dep:rio-vt"]
ts = ["dep:ts-rs"]
# The activity feed's shared search grammar, row and table (`feed`), which
# the mux client and the fno-agent reader both evaluate.
feed = ["dep:chrono", "dep:strsim"]

[[example]]
name = "gen-schema"
required-features = ["schema"]

[[example]]
name = "gen-pack-schema"
required-features = ["schema"]

[[example]]
name = "gen-ts"
required-features = ["ts"]

[dev-dependencies]
toml = "0.8"
jsonschema = { version = "0.30", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
