# The backlog tag vocabulary. This file is the one authority: the binary
# compiles it in, every tag write checks it, and the backfill classifier
# reads its keywords.
#
# A tag is `facet:value`. A closed facet takes only the values listed here.
# `release` takes a version. `topic` takes any kebab-case word. A tag with
# no `:` is an operational marker (main-repair, tier-hold) and stays legal.
# A `facet:value` name is also a legal GitHub and Linear label name, so a
# tracker backend can store it as a label unchanged.
#
# To add a value: add it here, in the same PR as the first node that needs it.

[facets.audience]
kind = "closed"
describe = "who the change is for"
values = ["user", "contributor", "internal"]

[facets.area]
kind = "closed"
describe = "the product surface the change touches"
# The values are the `name` of each [[areas]] row below.

[facets.harness]
kind = "closed"
describe = "the harness the work is specific to; omit when it is not"
values = ["claude", "codex", "opencode", "pi", "omp", "agy"]

[facets.release]
kind = "version"
describe = "the release the node must ship in, e.g. release:0.4.8"

[facets.topic]
kind = "open"
describe = "a free kebab-case word, e.g. topic:rust-idiom"

# Audience words. A title or details word from one list votes for that
# audience. The classifier stamps an audience only when one list wins.
[audience_keywords]
user = ["install", "installer", "onboarding", "quickstart", "readme", "website", "landing", "desktop", "ux", "ui"]
contributor = ["flaky", "test", "tests", "lint", "clippy", "ci", "shard", "cargo", "budget", "golden", "goldens", "refactor"]
internal = ["lead", "leads", "fleet", "law", "laws", "ruling", "watchdog", "reap", "reaper", "worker", "workers", "daemon", "org"]

# Areas. `audience` is the audience a node in the area has when no
# audience word says otherwise. `keywords` are whole words the classifier
# matches in the title (strong) and the details (weak). `projects` maps a
# whole project onto the area.
[[areas]]
name = "mux"
audience = "user"
keywords = ["mux", "pane", "panes", "portal", "portals", "keeper", "tmux", "tui", "sideline", "composer", "overlay"]

