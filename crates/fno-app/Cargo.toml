[package]
name = "fno-app"
# Own version line, decoupled from fno: sync-version.sh never stamps it.
# Bump it by hand; the release-app workflow reads it and runs on a
# fno-app-v<version> tag.
# Wire compatibility is checked at attach from the server .ver sidecar,
# never from this version.
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "The fno desktop app: a native GPUI window over a running fno mux server."
license = "Apache-2.0"
repository = "https://github.com/fnodotdev/fno"
homepage = "https://github.com/fnodotdev/fno"
# gpui is a pinned release and fno is a path dependency, so this crate ships
# as a release tarball, never to crates.io.
publish = false

[lib]
name = "fno_app"
path = "src/lib.rs"

[[bin]]
name = "fno-app"
path = "src/main.rs"

# The app links fno through `fno::app_api` and the modules fno already
# exports. fno never depends on this crate.
[dependencies]
fno = { path = "../fno" }
# The pack UI contract: the app parses view files with the same type the
# manifest parses, so the app and the CLI read one spelling.
fno-proto = { path = "../fno-proto" }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
# The window-state file: typed structs in app_state.rs round-trip through it.
serde = { version = "1", features = ["derive"] }
# The window, text and input layer (Zed's UI framework). `font-kit` is the one
# feature the macOS text system needs.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
# The attention signals' macOS calls: UNUserNotificationCenter (via raw
# objc), NSSound and the Dock tile. objc/cocoa ride the lockfile at the
# versions gpui already pins; block builds the authorization completion.
cocoa = "0.26"
objc = "0.2"
block = "0.1"
# Chat mode's markdown: gpui 0.2.2 ships no markdown element.
pulldown-cmark = { version = "0.13", default-features = false }
# The chat composer deletes by grapheme.
unicode-segmentation = "1"
# The grid and chat measure glyph widths.
unicode-width = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
