[package]
name = "fno-app"
# Own version line, decoupled from fno: sync-version.sh never stamps it.
# Bump it by hand; the release-app workflow reads it and runs on a
# fno-app-v<version> tag.
# Wire compatibility is checked at attach from the server .ver sidecar,
# never from this version.
version = "0.0.1"
edition = "2021"
rust-version = "1.92"
description = "The fno desktop app: a native GPUI window over a running fno mux server."
license = "Apache-2.0"
repository = "https://github.com/fnodotdev/fno"
# gpui-pre is a pinned release and fno is a path dependency, so this crate ships
# as a release tarball, never to crates.io.
publish = false

[lib]
name = "fno_app"
path = "src/lib.rs"

[[bin]]
name = "fno-app"
path = "src/main.rs"

# The platform text system must be built on the main thread, so this test
# owns main instead of running under the libtest harness.
[[test]]
name = "text_system"
harness = false

# The app links fno through `fno::app_api` and the modules fno already
# exports. fno never depends on this crate. It takes the `app` feature only:
# the web bridge, the session-bundle transfer and the PDF viewer stay behind
# fno's `web`, `transfer` and `pdf` features, because the app reaches a mux
# server through the client and runs none of them.
[dependencies]
fno = { path = "../fno", default-features = false, features = ["app"] }
# The pack UI contract: the app parses view files with the same type the
# manifest parses, so the app and the CLI read one spelling.
fno-proto = { path = "../fno-proto" }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
# The window-state file: typed structs in app_state.rs round-trip through it.
serde = { version = "1", features = ["derive"] }
# The window, text and input layer (Zed's UI framework), from gpui-pre: the
# weekly crates.io snapshot of Zed main. Pinned exact, because any snapshot
# may break the API. The fallback, if gpui-pre stops publishing, is a git rev
# pin on the same Zed commit (0.3.14 is zed@f126950).
gpui = { package = "gpui-pre", version = "=0.3.14", default-features = false }
# The platform layer gpui-pre splits out: gpui_platform::application() opens
# the macOS app. `font-kit` lives here, not on gpui: without it the macOS
# platform builds no text system and paints no glyphs.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["font-kit"] }
# Chat mode's markdown: gpui ships no markdown element.
pulldown-cmark = { version = "0.13", default-features = false }
# The chat composer deletes by grapheme.
unicode-segmentation = "1"
# The grid and chat measure glyph widths.
unicode-width = "0.2"
# The shot flattens the captured frame onto the theme fill: the window
# composites at one-percent alpha, and the png must carry it as opaque.
png = "0.18"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
# The macOS calls: notifications, NSSound and the Dock tile (alerts.rs),
# and the shot's NSApp window enumeration (shot.rs). Same majors as
# gpui-pre-macos, so the graph carries one copy of each.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }
