[package]
name = "fno-homes"
# Versions on its own API, apart from the fno product number: both parents
# publish, and a parent cannot publish with a dependency crates.io does not
# carry, so this crate publishes too and consumers take it by caret range.
# Raise it in the PR that raises the API.
version = "0.1.0"
edition = "2021"
# MSRV: matches the floor the fleet pins (fno-mail, fno-agent). The code is
# plain std; the pin keeps an older toolchain warned instead of confused.
rust-version = "1.89"
description = "The one class-home resolver shared by the fno front door and the fno-agent daemon."
license = "Apache-2.0"
repository = "https://github.com/fnodotdev/fno"
publish = true

[dependencies]
