[package]
name = "fno"
# The release number: the tag, the plugin manifests and this crate share it,
# stamped by scripts/release/sync-version.sh. crates/fno-agent versions on its
# own and bumps only when it changes; the updater proves a download by this
# crate's version (release_install.rs). Protocol compat is PROTO_VERSION.
version = "0.0.17"
edition = "2021"
# The mux pulls in tokio + rio-vt + portable-pty, so this crate no
# longer targets the old pure-std 1.74 floor. 1.89 matched fno-agent (the
# in-tree floor these same dependencies already build on); the PDF viewer's
# hayro declares MSRV 1.92, so the floor follows it rather than failing an
# older compiler deep inside a dependency build.
rust-version = "1.92"
description = "The fno terminal front door: a native terminal multiplexer (persistent server-owned PTYs, detach/reattach) plus the lazy bootstrapper that provisions and forwards to the fno Python CLI via uv."
license = "Apache-2.0"
repository = "https://github.com/fnodotdev/fno"
readme = "README.md"
keywords = ["fno", "multiplexer", "terminal", "pty", "mux"]
categories = ["command-line-utilities", "development-tools"]
publish = true

# The published binary is named `fno`: `cargo install fno` lands `~/.cargo/bin/fno`.
[[bin]]
name = "fno"
path = "src/main.rs"
required-features = ["full"]

[[example]]
name = "mux_latency"
required-features = ["full"]

[[example]]
name = "mux_footprint"
required-features = ["full"]

[[example]]
name = "chat_events"
required-features = ["full"]

[features]
# The contract build is `--no-default-features`: only the nine modules an
# external harness links (footnote_transcript, effect_map, version,
# provider_key, rules, glob, store_client, node_row, product_boundary) plus their six
# light dependencies (serde, serde_json, sha2, chrono, libc, toml; the last
# three are pins fnh already carries). `full` is everything the `fno` binary
# needs: `app` plus the web bridge, the transcript transfer and the PDF
# viewer. fnh and fno-app pin this crate with default-features = false, so a
# new dependency must either join the light set or stay behind a feature
# (`app` for the shared client surface, `web`, `transfer` or `pdf` for the
# heavy extras); an unconditional heavy dep silently re-inflates every
# fnh and fno-app build.
default = ["full"]
# `app` is what the desktop app links: the module surface the `fno` binary
# shares with fno-app (client helpers, proto, config, backlog model), with no
# web bridge, no session-bundle transfer and no PDF viewer. `full` adds those
# three and is what the binary builds.
app = [
    "dep:fno-proto",
    "dep:rio-vt",
    "dep:crossterm",
    "dep:ratatui-core",
    "dep:ratatui-widgets",
    "dep:throbber-widgets-tui",
    "dep:ratatui-image",
    "dep:image",
    "dep:portable-pty",
    "dep:regex",
    "dep:shlex",
    "dep:serde_yaml_ng",
    "dep:toml_edit",
    "dep:clap",
    "dep:clap_complete",
    "dep:unicode-width",
    "dep:blake3",
    "dep:rusqlite",
    "dep:thiserror",
    "dep:tempfile",
    "dep:tokio",
]
# `fno mux serve --web` and the attention API: the read-only HTTP + WebSocket bridge.
web = ["app", "dep:axum"]
# `fno agents transcript` and `session-move`: the wormhole transfer wire.
transfer = ["app", "dep:magic-wormhole", "dep:futures-util"]
# The file viewer's PDF pages.
pdf = ["app", "dep:hayro"]
# The agent runtime's client dispatch: every `fno agent` command the front
# door used to exec as the fno-agent binary now runs in process.
client = ["app", "dep:fno-agent"]
full = ["app", "web", "transfer", "pdf", "client"]

[dependencies]
# The one class-home resolver (cache/data/state precedence + platform
# defaults): pure std, so it joins the light set a contract build already
# carries. Both binaries link it; neither binary links the other. A caret
# range: the crate versions on its own, as fno-mail does.
fno-homes = { path = "../fno-homes", version = "0.1" }
# The mail protocol core: the hold store the sideline marks read. A caret
# range, as in fno-agent: fno-mail versions on its own.
fno-mail = { path = "../fno-mail", version = "0.1" }
fno-proto = { path = "../fno-proto", version = "0.2.4", features = ["async", "vt", "feed"], optional = true }
# The agent runtime. The edge points one way: fno links fno-agent, and
# fno-agent never links fno. Release publishes fno-agent first.
fno-agent = { path = "../fno-agent", version = "0.0.18", optional = true }
# `fno mux serve --web`: the read-only web bridge's HTTP + WebSocket
# surface. axum handles the untrusted-input HTTP parsing and WS handshake so
# the web-facing bridge does not hand-roll that security-sensitive code.
axum = { version = "0.8", features = ["ws"], optional = true }
# rio-vt replaces alacritty_terminal as the mux VT engine. `default-features
# = false` drops the PTY stack (the mux owns PTYs) and every renderer and
# windowing dep. The 0.5.29 registry tarball was verified byte-identical to
# the audited upstream source (raphamorim/rio at 0d9ede193ace8a); the exact
# pin keeps that audit true.
rio-vt = { version = "=0.5.29", default-features = false, optional = true }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
# The sideline's widget layer: `draw_sideline` renders a `Table` into a
# standalone `Buffer` and `ratatui_blit` copies it into the compositor's
# cells. No backend, no terminal: default features stay off so neither
# crate pulls a second crossterm beside the one pinned above. The plan
# wrote "0.30"; the split crates version independently (the 0.30 umbrella
# builds on exactly these), so the real lines are 0.1.x / 0.3.x.
ratatui-core = { version = "0.1", default-features = false, features = ["std"], optional = true }
ratatui-widgets = { version = "0.3", default-features = false, features = ["std"], optional = true }
# The Working row's spin frames come from this crate's symbol sets, so the
# glyph animation is a maintained widget crate's vocabulary, not a local
# table. Symbols only: default features off so no second ratatui backend
# rides in.
throbber-widgets-tui = { version = "0.11", default-features = false, optional = true }
# The file viewer's images. ratatui-image encodes kitty, iTerm2, sixel or
# half-blocks into a ratatui Buffer; default features off keeps out its
# crossterm backend and the chafa dylib (the terminal query rides rustix,
# which it always builds). `image` decodes the four formats a screenshot
# arrives in and nothing else.
ratatui-image = { version = "11.1", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
# The file viewer's PDF pages. Pure Rust (no pdfium dylib shipped beside the
# binary); renders one page to an RGBA pixmap that rides the image layer.
hayro = { version = "0.8", optional = true }
# store_client: uid-keyed temp socket names (getuid) and the exec lane's
# process-group kill (killpg).
libc = { version = "0.2" }
portable-pty = { version = "0.9", optional = true }
# `pane wait --pattern RE`: regex over a pane's visible grid (script API).
regex = { version = "1", optional = true }
# The review invocation parser's shlex.split port (one owner in
# review_invocation.rs). Already resolved through the lockfile.
shlex = { version = "2.0.1", optional = true }
# store_client.rs hashes long graph paths for the fallback keeper-socket
# name; the same crate version fno-agent pins, so one build stack.
sha2 = "0.10"
# The session-bundle transfer wire (send/receive over a pairing code).
magic-wormhole = { version = "0.7.7", optional = true }
# magic-wormhole's transfer reader is a futures AsyncRead, so the cursor
# and the rest of its io types come from here.
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
# The shared event store: the native front door routes `fno doctor event`
# onto this library; the runtime binary links the same types.
# Re-verify a picked answer's region fingerprint against the live grid before
# injecting. Must match the daemon's hash byte-for-byte across
# processes, so the same content hash both sides use - not a per-process
# DefaultHasher.
blake3 = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
# preserve_order: the `mux thread reseat` command round-trips registry.json as
# raw JSON to clear one row's mux ref; without it serde_json would reorder
# every key in the file on each flip. fno-agent enables it for the same
# registry-interop reason.
serde_json = { version = "1", features = ["preserve_order"] }
# The config read doors parse a legacy `settings.yaml` too: a fresh HOME
# (the worktree hooks, wt_config) serves yaml through `fno config get` cold,
# before any loader run could migrate it to flat config.toml. Same pin and
# same backend (pure-Rust unsafe-libyaml) the fno-agent crate resolves.
serde_yaml_ng = { version = "0.10", optional = true }
# Read the flat `config.toml` (stage 3): the interactive server reads
# `config.mux.*` directly (digest_overlay Pattern B) instead of shelling `fno`.
# The generated rules module also parses rule tables with it.
toml = { version = "0.8" }
# The spawn floor setter parses and rewrites config.toml keeping comments
# (spawn_floor.rs); `toml` only reads. Already resolved through `toml`.
toml_edit = { version = "0.22", optional = true }
# Native mux argv parsing: one typed declaration per flag, so the
# flag registry is structural rather than a hand-copied convention.
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
# Popup chrome measures and paints in terminal columns: a fullwidth
# glyph is one char and two cells. Already resolved transitively via
# ratatui-core, so this adds no new build artifact.
unicode-width = { version = "0.2", optional = true }
rusqlite = { version = "0.41.1", features = ["bundled", "backup", "fallible_uint", "functions"], optional = true }
# The generated rules module compares rule review dates through it.
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "clock"] }
thiserror = { version = "2", optional = true }
tempfile = { version = "3", optional = true }
tokio = { optional = true, version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
    # bounded, fail-open shell-out to `fno-agent digest` on attach.
    "process",
] }

[dev-dependencies]
# The node vocabulary twin decodes the graph-store goldens fno-agent keeps.
base64 = "0.22"
